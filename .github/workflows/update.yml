name: Update data and deploy site

on:
  schedule:
    - cron: "0 15 * * *"  # 8am MST, after ACIS has the previous day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch daily record from ACIS
        run: python scripts/fetch_acis.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data through $(tail -n 1 data/daily.csv | cut -d, -f1)"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r data _site/data
          # Stamp asset URLs so browsers never mix cached old scripts with new ones.
          sed -i "s/?v=VERSION/?v=${GITHUB_SHA::8}/g" _site/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
